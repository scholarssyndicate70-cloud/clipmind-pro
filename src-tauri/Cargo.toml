[package]
name    = "clipmind-pro"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri              = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog   = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
num_cpus           = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level       = 3
lto             = true
codegen-units   = 1
panic           = "abort"
strip           = true
